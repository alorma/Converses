name: Upload AAB

# Builds the signed release AAB from main and uploads it, with its release notes, to the chosen Google Play track. Nothing
# else: no tag, no GitHub release, no version bump and no store listing (that is release.yml). Manual trigger only
on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: read

# Google Play només admet una edició oberta a la vegada: comparteix grup amb release.yml i publish-listing.yml
concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Fora del repo (.gitignore): el plugin google-services el necessita per compilar
      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Disable snapshot
        run: sed -i "s/^snapshot=.*/snapshot=false/" version.properties

      - name: Get version
        id: version
        run: |
          VERSION=$(./gradlew -q :app:printVersionName)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "**Version:** \`$VERSION\` → \`${{ inputs.track }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p certs
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > certs/release.keystore

      # Gradle Play Publisher: compila l'AAB signat i el puja amb les notes de app/src/main/play/release-notes
      - name: Build and upload to Google Play
        run: >-
          ./gradlew
          :app:publishReleaseBundle --track "${{ inputs.track }}" --release-name "${{ steps.version.outputs.version }}"
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REVENUECAT_GOOGLE_API_KEY: ${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
