name: Release

# Builds the signed release APK and AAB from main, uploads the AAB and its release notes to Google Play, publishes a GitHub release
# tagged with the version in version.properties and bumps the minor version (as a snapshot) for the next cycle.
# Manual trigger only
on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: beta

permissions:
  contents: write

# Google Play només admet una edició oberta a la vegada: comparteix grup amb publish-listing.yml
concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Disable snapshot
        run: sed -i "s/^snapshot=.*/snapshot=false/" version.properties

      - name: Get version
        id: version
        run: |
          VERSION=$(./gradlew -q printVersionName)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "**Version:** \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the tag already exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p certs
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > certs/release.keystore

      - name: Build signed release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB and mapping
        uses: actions/upload-artifact@v7
        with:
          name: converses-release-aab-${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # Gradle Play Publisher: puja l'AAB i, de app/src/main/play/release-notes, les notes de cada idioma.
      # El mapping de R8 va dins l'AAB
      - name: Upload to Google Play
        run: ./gradlew :app:publishReleaseBundle --track "${{ inputs.track }}" --release-name "${{ steps.version.outputs.version }}"
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk "converses-$VERSION.apk"
          gh release create "$VERSION" \
            --title "Converses $VERSION" \
            --generate-notes \
            --target "${{ github.sha }}" \
            "converses-$VERSION.apk"

      - name: Bump minor version for the next release
        run: |
          MAJOR=$(grep "^major=" version.properties | cut -d= -f2)
          MINOR=$(grep "^minor=" version.properties | cut -d= -f2)
          NEXT="$MAJOR.$((MINOR + 1)).0"
          printf "major=%s\nminor=%s\npatch=0\nsnapshot=true\n" "$MAJOR" "$((MINOR + 1))" > version.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "Bump version to $NEXT-SNAPSHOT"
          git push origin main
