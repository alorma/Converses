<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Onboarding · pas 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;letter-spacing:normal;text-transform:none;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.msf{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.disp{font-variation-settings:'wdth' 118,'opsz' 72}
</style><style>
@keyframes ob-pop { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 60% { transform: scale(1.12) rotate(8deg); opacity: 1; } 80% { transform: scale(0.96) rotate(-2deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes ob-fly { 0% { transform: translate(var(--dx), var(--dy)) scale(0) rotate(-90deg); opacity: 0; } 65% { transform: translate(0, 0) scale(1.15) rotate(10deg); opacity: 1; } 85% { transform: translate(0, 0) scale(0.95) rotate(-3deg); } 100% { transform: translate(0, 0) scale(1) rotate(0); opacity: 1; } }
@keyframes ob-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes ob-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes ob-line { from { width: 0; } }
@keyframes ob-fade-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes ob-row { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes ob-dot { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes ob-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes ob-type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes ob-ring { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.9); opacity: 0; } }
@keyframes ob-scan { 0% { top: -10%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
@keyframes ob-ok { to { background: var(--ok); color: var(--on-ok); } }
@keyframes ob-out { to { opacity: 0; transform: scale(0.6); } }
@keyframes ob-in { from { opacity: 0; transform: scale(0.4) rotate(-30deg); } to { opacity: 1; transform: none; } }
@keyframes ob-bounce { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.08); } 70% { transform: scale(0.97); } }
@keyframes ob-bg { 0% { opacity: 0; transform: scale(0.2); } 100% { opacity: 1; transform: scale(1); } }
.ob-a { animation-fill-mode: both; }
</style>

</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Roboto Flex', system-ui, sans-serif; {{theme}}; background: var(--bg); color: var(--on)">
<header style="display: flex; align-items: center; justify-content: flex-end; height: 64px; padding: 8px 12px 0 12px; box-sizing: border-box">
  <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
    <a href="MainBuitM3E.dc.html" style="height: 40px; padding: 0 16px; border-radius: 20px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: var(--on-var)">Omet</a>
  </sc-if>
</header>

<section aria-label="Il·lustració (toca-la per repetir l'animació)" onClick="{{replay}}" style="height: 380px; margin: 0 20px; position: relative; cursor: pointer; {{okVars}}">
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">

  <sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; inset: 0">
      <div class="ob-a" style="position: absolute; left: 95px; top: 95px; width: 160px; height: 160px; animation: ob-pop 0.9s cubic-bezier(.2,.9,.3,1.2) 0.1s both">
        <div style="width: 160px; height: 160px; clip-path: {{bubbleClip}}; background: var(--pri); display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 40px; box-sizing: border-box">
          <span class="ob-a" style="height: 10px; border-radius: 5px; background: var(--on-pri); width: 100%; animation: ob-line 0.5s ease-out 0.8s both"></span>
          <span class="ob-a" style="height: 10px; border-radius: 5px; background: var(--on-pri); width: 70%; animation: ob-line 0.4s ease-out 1.05s both"></span>
        </div>
      </div>
      <sc-for list="{{orbit}}" as="o" hint-placeholder-count="5">
        <div style="position: absolute; left: {{o.x}}px; top: {{o.y}}px; width: {{o.s}}px; height: {{o.s}}px; animation: ob-float {{o.floatDur}}s ease-in-out {{o.floatDelay}}s infinite">
          <div class="ob-a" style="--dx: {{o.dx}}px; --dy: {{o.dy}}px; width: {{o.s}}px; height: {{o.s}}px; animation: ob-fly 0.9s cubic-bezier(.2,.9,.3,1.15) {{o.delay}}s both">
            <div style="width: {{o.s}}px; height: {{o.s}}px; clip-path: {{o.clip}}; background: {{o.bg}}; color: #1E1D24; display: flex; align-items: center; justify-content: center; font-size: {{o.fs}}px; font-weight: 800; animation: ob-spin {{o.spinDur}}s linear {{o.delay}}s infinite">
              <span style="animation: ob-spin {{o.spinDur}}s linear {{o.delay}}s infinite reverse">{{o.ini}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" class="ob-a" style="position: absolute; left: 6px; right: 6px; top: 70px; padding: 20px 16px 8px 16px; border-radius: 32px; background: var(--card); display: flex; flex-direction: column; animation: ob-fade-up 0.5s ease-out both">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; gap: 10px">
          <div style="width: 34px; flex: none; display: flex; flex-direction: column; align-items: center">
            <span class="ob-a" style="width: 32px; height: 32px; flex: none; border-radius: {{r.radius}}; background: {{r.bg}}; color: {{r.fg}}; border: {{r.border}}; box-sizing: border-box; clip-path: {{r.clip}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; animation: ob-dot 0.45s cubic-bezier(.2,.9,.3,1.3) {{r.d0}}s both"><sc-if value="{{r.isIcon}}" hint-placeholder-val="{{ true }}"><span class="ms {{r.fill}}" style="font-size: 18px">{{r.icon}}</span></sc-if><sc-if value="{{r.isAvatar}}" hint-placeholder-val="{{ false }}">L</sc-if></span>
            <span class="ob-a" style="width: 2px; flex: 1; min-height: 8px; background: var(--outline-var); transform-origin: top; animation: ob-grow 0.5s ease-out {{r.d2}}s both"></span>
          </div>
          <div class="ob-a" style="flex: 1; margin-bottom: 12px; padding: 10px 14px; border-radius: 18px; background: var(--bg); display: flex; flex-direction: column; gap: 3px; animation: ob-row 0.45s cubic-bezier(.2,.8,.2,1) {{r.d1}}s both">
            <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: var(--on-var)">{{r.label}}</div>
            <div class="ob-a" style="font-size: 15px; line-height: 1.35; animation: ob-type 0.7s steps(28, end) {{r.d2}}s both">{{r.text}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isStep3}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0">
      <div class="ob-a" style="position: absolute; left: 35px; top: 10px; width: 280px; height: 280px; border-radius: 140px; background: var(--ok-c); animation: ob-bg 0.7s cubic-bezier(.2,.9,.3,1.1) 2.5s both"></div>
      <div class="ob-a" style="position: absolute; left: 85px; top: 60px; width: 180px; height: 180px; animation: ob-pop 0.8s cubic-bezier(.2,.9,.3,1.2) 0.1s both">
        <div class="ob-a" style="width: 180px; height: 180px; clip-path: {{bigClip}}; background: #DCD3F5; color: #1E1D24; position: relative; animation: ob-bounce 0.6s ease-out 2.7s both">
          <span class="ms msf ob-a" style="position: absolute; left: 54px; top: 54px; font-size: 72px; animation: ob-out 0.25s ease-in 2.6s both">lock</span>
          <span class="ms msf ob-a" style="position: absolute; left: 54px; top: 54px; font-size: 72px; animation: ob-in 0.4s cubic-bezier(.2,.9,.3,1.3) 2.8s both">lock_open</span>
        </div>
      </div>
      <div style="position: absolute; left: 215px; top: 180px; width: 92px; height: 92px">
        <span class="ob-a" style="position: absolute; inset: 6px; border-radius: 40px; border: 3px solid var(--pri); animation: ob-ring 1s ease-out 0.9s 2 both"></span>
        <div class="ob-a" style="position: absolute; left: 0; top: 0; width: 80px; height: 80px; border-radius: 40px; background: var(--pri); color: var(--on-pri); border: 6px solid var(--bg); box-sizing: content-box; overflow: hidden; animation: ob-pop 0.6s cubic-bezier(.2,.9,.3,1.3) 0.5s both, ob-ok 0.35s ease-out 2.4s forwards">
          <span class="ms ob-a" style="position: absolute; left: 18px; top: 18px; font-size: 44px; animation: ob-out 0.2s ease-in 2.4s both">fingerprint</span>
          <span class="ms ob-a" style="position: absolute; left: 18px; top: 18px; font-size: 44px; animation: ob-in 0.35s cubic-bezier(.2,.9,.3,1.4) 2.55s both">check</span>
          <span class="ob-a" style="position: absolute; left: 8px; right: 8px; height: 3px; border-radius: 2px; background: var(--on-pri); box-shadow: 0 0 10px var(--on-pri); animation: ob-scan 0.7s ease-in-out 1.1s 2 both"></span>
        </div>
      </div>
      <div class="ob-a" style="position: absolute; left: 0; right: 0; top: 300px; display: flex; justify-content: center; gap: 8px; animation: ob-fade-up 0.5s ease-out 3.1s both">
        <span style="height: 36px; padding: 0 14px 0 10px; border-radius: 18px; background: var(--card-hi); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><span class="ms" style="font-size: 18px">cloud_off</span>Sense núvol</span>
        <span style="height: 36px; padding: 0 14px 0 10px; border-radius: 18px; background: var(--card-hi); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><span class="ms" style="font-size: 18px">no_accounts</span>Sense comptes</span>
      </div>
    </div>
  </sc-if>

  <section style="position: absolute; left: -20px; right: -20px; top: 400px; padding: 0 28px; display: flex; flex-direction: column; gap: 12px">
    <h1 class="disp ob-a" style="margin: 0; font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.6px; animation: ob-fade-up 0.5s ease-out 0.15s both">{{title}}</h1>
    <p class="ob-a" style="margin: 0; font-size: 17px; line-height: 1.45; color: var(--on-var); animation: ob-fade-up 0.5s ease-out 0.3s both">{{body}}</p>
  </section>
</sc-if>
</section>

<footer style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 32px 28px; display: flex; align-items: center; justify-content: space-between">
  <div role="tablist" aria-label="Pas {{stepNum}} de 3" style="display: flex; align-items: center; gap: 6px">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{d.sel}}" aria-label="Pas {{d.n}}" onClick="{{d.go}}" style="width: {{d.w}}px; height: 8px; padding: 0; border: 0; border-radius: 4px; background: {{d.bg}}; transition: width 0.35s cubic-bezier(.2,.9,.3,1.2), background 0.35s"></button>
    </sc-for>
  </div>
  <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{next}}" style="height: 56px; padding: 0 22px 0 28px; border: 0; border-radius: 28px; background: var(--pri); color: var(--on-pri); font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px">Següent<span class="ms" aria-hidden="true">arrow_forward</span></button>
  </sc-if>
  <sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
    <a href="MainBuitM3E.dc.html" class="ob-a" style="height: 56px; padding: 0 28px; border-radius: 28px; background: var(--pri); color: var(--on-pri); font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; animation: ob-pop 0.5s cubic-bezier(.2,.9,.3,1.3) 3.2s both">Comença</a>
  </sc-if>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pas": {"editor": "enum", "options": ["1", "2", "3"], "default": "1", "section": "Onboarding"}, "seed": {"editor": "color", "default": "#5B6EAE", "options": ["#5B6EAE", "#3F7A5C", "#A65A3A", "#8A4F9E"], "section": "Color dinàmic"}, "tint": {"editor": "enum", "options": ["tenyit", "pur"], "default": "tenyit", "section": "Color dinàmic"}, "dark": {"editor": "boolean", "default": false, "section": "Color dinàmic"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {

  hueOf(hex) {
    hex = String(hex || '#5B6EAE').replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
    var v = [0, 2, 4].map(function (i) { var c = parseInt(hex.substr(i, 2), 16) / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    var l = Math.cbrt(0.4122214708 * v[0] + 0.5363325363 * v[1] + 0.0514459929 * v[2]);
    var m = Math.cbrt(0.2119034982 * v[0] + 0.6806995451 * v[1] + 0.1073969566 * v[2]);
    var s = Math.cbrt(0.0883024619 * v[0] + 0.2817188376 * v[1] + 0.6299787005 * v[2]);
    var a = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
    var b = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
    var h = Math.atan2(b, a) * 180 / Math.PI;
    return h < 0 ? h + 360 : h;
  }
  themeVars(p) {
    var h = this.hueOf(p.seed ?? '#5B6EAE');
    var k = (p.tint ?? 'tenyit') === 'pur' ? 0 : 1;
    var dark = p.dark ?? false;
    var o = function (L, C) { return 'oklch(' + L + ' ' + (C * k).toFixed(4) + ' ' + h.toFixed(1) + ')'; };
    var v = dark ? {
      bg: o(0.17, 0.012), card: o(0.225, 0.014), 'card-hi': o(0.265, 0.016), 's-high': o(0.28, 0.016), 's-highest': o(0.32, 0.018),
      on: o(0.94, 0.012), 'on-var': o(0.78, 0.016), outline: o(0.6, 0.016), 'outline-var': o(0.38, 0.016),
      pri: o(0.93, 0.03), 'on-pri': o(0.2, 0.03), 'pri-c': o(0.37, 0.045), 'on-pri-c': o(0.94, 0.03),
      err: 'oklch(0.78 0.12 25)', 'on-err': 'oklch(0.3 0.1 27)', 'err-c': 'oklch(0.4 0.12 27)', 'on-err-c': 'oklch(0.93 0.04 27)',
      scrim: 'rgba(0,0,0,0.6)'
    } : {
      bg: o(0.965, 0.01), card: o(0.995, 0.004), 'card-hi': o(0.94, 0.012), 's-high': o(0.92, 0.014), 's-highest': o(0.895, 0.016),
      on: o(0.2, 0.015), 'on-var': o(0.44, 0.016), outline: o(0.64, 0.016), 'outline-var': o(0.86, 0.014),
      pri: o(0.24, 0.03), 'on-pri': o(0.985, 0.006), 'pri-c': o(0.86, 0.045), 'on-pri-c': o(0.22, 0.03),
      err: 'oklch(0.53 0.2 27)', 'on-err': '#FFFFFF', 'err-c': 'oklch(0.93 0.045 27)', 'on-err-c': 'oklch(0.36 0.13 27)',
      scrim: 'rgba(0,0,0,0.38)'
    };
    return Object.keys(v).map(function (key) { return '--' + key + ': ' + v[key]; }).join('; ');
  }
  shape(size, n, amp, rot) {
    var c = size / 2, R = size / 2 / (1 + amp), pts = [];
    for (var i = 0; i < 144; i++) {
      var t = i / 144 * 2 * Math.PI;
      var r = R * (1 + amp * Math.cos(n * t + (rot || 0)));
      pts.push((c + r * Math.cos(t)).toFixed(1) + ' ' + (c + r * Math.sin(t)).toFixed(1));
    }
    return "path('M" + pts.join(' L') + " Z')";
  }
  renderVals() {
    var x = this.extra();
    x.theme = this.themeVars(this.props);
    return x;
  }

  extra() {
var self = this;
    var st = this.state || {};
    var step = st.step ?? (parseInt(this.props.pas || '1', 10));
    var dark = this.props.dark ?? false;
    var ready = st.ready ?? true;
    var go = function (n) {
      self.setState({ step: n, ready: false });
      setTimeout(function () { self.setState({ ready: true }); }, 30);
    };
    var texts = {
      1: ['Recorda cada conversa', 'Què et va explicar? Què li vas dir tu? Guarda-ho persona a persona i no ho tornis a barrejar mai més.'],
      2: ['Tot en una cronologia', 'Cada entrada diu qui ho ha dit: tu, l’altra persona o un apunt teu. Per xat, per xarxes o en persona, tot queda en ordre.'],
      3: ['Només per a tu', 'Les notes es queden al mòbil. Si vols, protegeix una persona amb l’empremta i ningú més la podrà obrir.']
    };
    var orbitDefs = [
      { x: 18, y: 40, s: 72, n: 9, a: 0.07, bg: '#C9EBD6', ini: 'JP', fs: 22 },
      { x: 250, y: 20, s: 88, n: 4, a: 0.16, bg: '#FFD6BF', ini: 'LF', fs: 26 },
      { x: 270, y: 250, s: 64, n: 12, a: 0.045, bg: '#CBE3F7', ini: 'R', fs: 20 },
      { x: 40, y: 260, s: 84, n: 6, a: 0.1, bg: '#F7CFDD', ini: 'MS', fs: 24 },
      { x: 160, y: 300, s: 48, n: 9, a: 0.07, bg: '#F1E9A8', ini: 'A', fs: 16 }
    ];
    var rowDefs = [
      { label: 'LUNA · 21:25 · DISCORD', text: 'La Nyra deu diners al gremi.', avatar: true },
      { label: 'JO · 21:40 · DISCORD', text: 'En Kael va perdre el germà.', icon: 'person', fill: 'msf', bg: 'var(--pri)', fg: 'var(--on-pri)', radius: '16px', border: '0' },
      { label: 'APUNT · AHIR · EN PERSONA', text: 'Partida a la jornada de jocs.', icon: 'edit_note', fill: '', bg: 'var(--card)', fg: 'var(--on)', radius: '10px', border: '2px solid var(--outline)' }
    ];
    return {
      okVars: dark ? '--ok: oklch(0.74 0.15 150); --on-ok: oklch(0.22 0.06 150); --ok-c: oklch(0.32 0.07 150)'
                   : '--ok: oklch(0.58 0.15 150); --on-ok: #FFFFFF; --ok-c: oklch(0.93 0.05 150)',
      ready: ready,
      replay: function () { go(step); },
      isStep1: step === 1, isStep2: step === 2, isStep3: step === 3,
      isLast: step === 3, notLast: step !== 3, stepNum: step,
      title: texts[step][0], body: texts[step][1],
      bubbleClip: this.shape(160, 9, 0.07, 0),
      bigClip: this.shape(180, 9, 0.07, 0),
      orbit: orbitDefs.map(function (o, i) {
        return Object.assign({}, o, { clip: self.shape(o.s, o.n, o.a, 0),
          dx: Math.round(175 - (o.x + o.s / 2)), dy: Math.round(190 - (o.y + o.s / 2)),
          delay: (0.55 + i * 0.14).toFixed(2), floatDur: (3 + (i % 3) * 0.6).toFixed(1), floatDelay: (1.6 + i * 0.2).toFixed(1),
          spinDur: 18 + i * 4 });
      }),
      rows: rowDefs.map(function (r, i) {
        var base = 0.5 + i * 0.75;
        var times = { d0: base.toFixed(2), d1: (base + 0.15).toFixed(2), d2: (base + 0.35).toFixed(2) };
        return r.avatar
          ? Object.assign({ label: r.label, text: r.text, isAvatar: true, isIcon: false, bg: '#DCD3F5', fg: '#1E1D24', radius: '0', border: '0', clip: self.shape(32, 9, 0.07, 0) }, times)
          : Object.assign({}, r, { isAvatar: false, isIcon: true, clip: 'none' }, times);
      }),
      dots: [1, 2, 3].map(function (n) {
        var on = n === step;
        return { n: n, sel: on ? 'true' : 'false', w: on ? 28 : 8, bg: on ? 'var(--pri)' : 'var(--outline-var)', go: function () { go(n); } };
      }),
      next: function () { go(Math.min(3, step + 1)); }
    };
  }
}
</script>
</body>
</html>
