<div style="padding:20px;border-radius:24px;background:#F7F5EF;display:flex;flex-direction:column;gap:14px"><div style="font-size:14px;font-weight:700">Color de persona · superfície · avatar · text</div><div style="display:flex;gap:10px;flex-wrap:wrap"><div style="display:flex;flex-direction:column;gap:4px;width:112px"><div style="display:flex;height:44px;border-radius:14px;overflow:hidden"><span style="flex:1;background:#E2F2E8"></span><span style="flex:1;background:#C2E8D0"></span><span style="flex:1;background:#245C3F"></span></div><span style="font-size:11.5px;color:#525252">Menta</span></div><div style="display:flex;flex-direction:column;gap:4px;width:112px"><div style="display:flex;height:44px;border-radius:14px;overflow:hidden"><span style="flex:1;background:#ECE7F8"></span><span style="flex:1;background:#D9CFF5"></span><span style="flex:1;background:#4F3E92"></span></div><span style="font-size:11.5px;color:#525252">Lavanda</span></div><div style="display:flex;flex-direction:column;gap:4px;width:112px"><div style="display:flex;height:44px;border-radius:14px;overflow:hidden"><span style="flex:1;background:#FBE7DC"></span><span style="flex:1;background:#FFD3BA"></span><span style="flex:1;background:#8A3E22"></span></div><span style="font-size:11.5px;color:#525252">Préssec</span></div><div style="display:flex;flex-direction:column;gap:4px;width:112px"><div style="display:flex;height:44px;border-radius:14px;overflow:hidden"><span style="flex:1;background:#E0EDF8"></span><span style="flex:1;background:#C6DFF5"></span><span style="flex:1;background:#24557F"></span></div><span style="font-size:11.5px;color:#525252">Cel</span></div><div style="display:flex;flex-direction:column;gap:4px;width:112px"><div style="display:flex;height:44px;border-radius:14px;overflow:hidden"><span style="flex:1;background:#F9E3EA"></span><span style="flex:1;background:#F5CADA"></span><span style="flex:1;background:#8C3456"></span></div><span style="font-size:11.5px;color:#525252">Rosa</span></div><div style="display:flex;flex-direction:column;gap:4px;width:112px"><div style="display:flex;height:44px;border-radius:14px;overflow:hidden"><span style="flex:1;background:#F5F0CF"></span><span style="flex:1;background:#EEE39C"></span><span style="flex:1;background:#5E5410"></span></div><span style="font-size:11.5px;color:#525252">Llimona</span></div></div><div style="font-size:12px;color:#525252">Fons de l’app: crema #FBF8F1 (fosc #14130F) · tinta #1C1B17 · accent de recompte #F2E8A6</div></div>
</div>
<div style="width:460px;flex:none;box-sizing:border-box;padding:20px;border-radius:24px;background:#F3F3F3;display:flex;flex-direction:column;gap:12px"><div style="font-size:14px;font-weight:700">Com funciona</div><div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:13px;font-weight:700">Idea</div><div style="font-size:12.5px;line-height:1.5;color:#525252">La interfície fa servir el color de cada persona: superfícies pastel per a les seves targetes i el to fosc per al text i la targeta destacada. L’app en si és neutra i càlida (fons crema), i la persona hi posa el color.</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:13px;font-weight:700">Llistat (14a, 14e)</div><div style="font-size:12.5px;line-height:1.5;color:#525252">Capçalera amb el títol ample i dos botons amb forma. Targeta destacada amb l’última conversa i un botó galeta per afegir-hi una entrada. Xips grans de 52 dp. Agrupat per dates amb una insígnia de recompte i el títol ample. Cada persona és una targeta de 92 dp, radi 32, en el seu pastel, amb l’hora en ample a la dreta.</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:13px;font-weight:700">Detall (14b)</div><div style="font-size:12.5px;line-height:1.5;color:#525252">Tota la pantalla agafa el to clar de la persona. Avatar trèvol de 200 dp, nom en display ample del seu color fosc. Botó principal «Nova entrada» de 64 dp i galeta per a «Nova tasca». Recomptes en tres rajoles. Cronologia en bombolles: Jordi en pastel a l’esquerra, Jo en tinta a la dreta, apunts amb vora.</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:13px;font-weight:700">Entrada (14c)</div><div style="font-size:12.5px;line-height:1.5;color:#525252">Pantalla pròpia en tocar una entrada (substitueix el menú 2d). Text en gran, l’hora en display de 92 sp i una graella d’accions: Edita (gran) + Copia, Canvia el canal, Fes-ne una tasca (Pro) i Esborra.</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:13px;font-weight:700">Nota ràpida (14d)</div><div style="font-size:12.5px;line-height:1.5;color:#525252">Qui es tria amb tres formes grans (cercle, trèvol de la persona, galeta), amb un indicador sota. Text de 22 sp. Desa és una galeta de 96 dp al costat del selector de Quan.</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:13px;font-weight:700">Moviment</div><div style="font-size:12.5px;line-height:1.5;color:#525252"><code style="font-size:11.5px;background:#E6E6E6;padding:1px 4px;border-radius:4px">MotionScheme.expressive()</code>. Les formes fan <code style="font-size:11.5px;background:#E6E6E6;padding:1px 4px;border-radius:4px">Morph</code> en prémer (galeta → cercle) i en seleccionar Qui. La targeta destacada entra amb molla; les targetes es reordenen amb <code style="font-size:11.5px;background:#E6E6E6;padding:1px 4px;border-radius:4px">animateItem()</code>.</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:13px;font-weight:700">Compose</div><div style="font-size:12.5px;line-height:1.5;color:#525252"><code style="font-size:11.5px;background:#E6E6E6;padding:1px 4px;border-radius:4px">MaterialExpressiveTheme</code>, <code style="font-size:11.5px;background:#E6E6E6;padding:1px 4px;border-radius:4px">MaterialShapes</code> (Cookie9Sided, Clover4Leaf, Flower, Sunny), <code style="font-size:11.5px;background:#E6E6E6;padding:1px 4px;border-radius:4px">toShape()</code>; tipografia amb <code style="font-size:11.5px;background:#E6E6E6;padding:1px 4px;border-radius:4px">FontVariation.width(151f)</code>, <code style="font-size:11.5px;background:#E6E6E6;padding:1px 4px;border-radius:4px">weight(900)</code>. Colors de persona: <code style="font-size:11.5px;background:#E6E6E6;padding:1px 4px;border-radius:4px">dynamicColorScheme</code> a partir del color de l’avatar, amb el mateix mapatge que «Color de la persona».</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:13px;font-weight:700">Accessibilitat</div><div style="font-size:12.5px;line-height:1.5;color:#525252">Contrast AA del text fosc sobre pastel comprovat. Els botons d’icona de 14c porten contentDescription. Respecta «Elimina animacions».</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:13px;font-weight:700">Abast</div><div style="font-size:12.5px;line-height:1.5;color:#525252">És una proposta de direcció visual, en una secció a part: no substitueix encara cap pantalla. Si us agrada, el següent pas és portar-ho a Ajustos, Pro i els fluxos de creació.</div></div></div>
</div>
</div></figure></div></section>
